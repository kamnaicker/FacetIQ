name: Publish Main

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .Net
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: restore
        run: dotnet restore ./FacetIQ.slnx

      - name: Build
        run: dotnet build ./FacetIQ.slnx --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./FacetIQ.slnx --configuration Release --no-restore
